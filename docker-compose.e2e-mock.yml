services:
  e2e-mock:
    image: ${POLYGON_REPLICA_E2E_IMAGE:?set by tests/scripts/e2e-mock.sh}
    entrypoint: ["python3", "/opt/e2e/e2e_mock.py"]
    restart: "no"
    environment:
      GIT_OPTIONAL_LOCKS: "0"
      POLYGON_REPLICA_E2E_APP_ORIGIN: http://app:8001
      POLYGON_REPLICA_E2E_DB: /var/lib/polygon-replica/metadata.db
      POLYGON_REPLICA_E2E_CACHE_ROOT: /tmp/polygon-replica
      POLYGON_REPLICA_E2E_ARTIFACTS_ROOT: /srv/polygon-replica/export
      POLYGON_REPLICA_E2E_STATE_DIR: /var/backups/polygon-replica/e2e-state
      POLYGON_REPLICA_E2E_BARE_ROOT: /srv/polygon-replica/git
      POLYGON_REPLICA_E2E_WORKSPACE_ROOT: /srv/polygon-replica/workspaces
      POLYGON_REPLICA_E2E_JUDGEHOST_TOKEN: ${POLYGON_REPLICA_E2E_JUDGEHOST_TOKEN:?set by tests/scripts/e2e-mock.sh}
      POLYGON_REPLICA_E2E_ADMIN_PASSWORD: ${POLYGON_REPLICA_E2E_ADMIN_PASSWORD:?set by tests/scripts/e2e-mock.sh}
    volumes:
      - ./tests/docker_e2e:/opt/e2e:ro
      - srv:/srv/polygon-replica:ro
      # SQLite WAL readers need directory access for the shared-memory file.
      # e2e_mock.py still opens metadata.db with URI mode=ro.
      - var:/var/lib/polygon-replica
      - cache:/tmp/polygon-replica:ro
      - state:/var/backups/polygon-replica:ro
    networks:
      - e2e
