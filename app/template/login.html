{% extends "auth_base.html" %}
{% block auth_title %}Polygon-Replica{% endblock %}
{% block auth_subtitle %}Sign in with username and password.{% endblock %}

{% block auth_form %}
<form id="login-form" class="form-stack" method="post" action="/login">
  <label for="username">Username</label>
  <input id="username" name="username" minlength="3" maxlength="16" placeholder="user-name" autofocus />
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" placeholder="password" />
  <input type="hidden" name="csrf_token" value="{{ password_csrf_token }}" />
  <input type="hidden" name="key_id" value="" />
  <input type="hidden" name="envelope_token" value="" />
  <input type="hidden" name="encrypted_verifier" value="" />
  <input type="hidden" name="next" value="{{ next_path }}" />
  <button class="btn primary-action" type="submit">Sign in</button>
</form>
{% endblock %}

{% block auth_footer %}
<p class="muted">No account? <a href="/register{% if next_path %}?next={{ next_path | urlencode }}{% endif %}">Register</a></p>
{% endblock %}
