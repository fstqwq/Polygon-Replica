{% extends "root_base.html" %}
{% block content %}
<div class="page-title-inline root-page-title-inline">
  <h1 class="page-title">Settings</h1>
  {% if user.is_system_admin %}<a href="/admin">Open admin panel</a>{% endif %}
</div>
{% include "_flash_message.html" %}
<section class="content-section-plain settings-account-panel">
  <div class="settings-account-summary">
    <div>
      <span class="muted">Signed in as</span>
      <strong>{{ user.username }}</strong>
    </div>
    <a href="/agent/sessions">Connected agents</a>
  </div>
  <h2>Change password</h2>
  <form id="settings-password-form" class="form-stack settings-password-form" method="post" action="/settings/password">
    <label for="current_password">Current password</label>
    <input id="current_password" name="current_password" type="password" autocomplete="current-password" />
    <label for="new_password">New password</label>
    <input id="new_password" name="new_password" type="password" autocomplete="new-password" />
    <label for="new_password_confirm">Confirm new password</label>
    <input id="new_password_confirm" name="new_password_confirm" type="password" autocomplete="new-password" />
    <input type="hidden" name="csrf_token" value="{{ password_csrf_token }}" />
    <input type="hidden" name="current_password_salt" value="{{ current_password_salt }}" />
    <input type="hidden" name="current_password_iters" value="{{ current_password_iters }}" />
    <input type="hidden" name="current_password_key_id" value="" />
    <input type="hidden" name="current_password_envelope_token" value="" />
    <input type="hidden" name="current_password_encrypted_verifier" value="" />
    <input type="hidden" name="new_password_salt" value="{{ new_password_salt }}" />
    <input type="hidden" name="new_password_iters" value="{{ new_password_iters }}" />
    <input type="hidden" name="new_password_key_id" value="" />
    <input type="hidden" name="new_password_envelope_token" value="" />
    <input type="hidden" name="new_password_encrypted_verifier" value="" />
    <div class="form-row form-row-actions">
      <button class="btn primary-action" type="submit">Update password</button>
    </div>
  </form>
</section>
{% endblock %}
