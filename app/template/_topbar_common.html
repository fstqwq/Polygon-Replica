<div class="brand-row">
  <div class="brand">
    <a class="logo" href="/problems"><span class="accent-gradient-text logo-gradient-text">not polygon</span></a>
    <div class="tagline">Unprofessional way to prepare programming contest problems</div>
  </div>
  <div id="top-event-slot" class="top-event-slot" aria-live="polite" aria-atomic="true"></div>
  <div class="top-actions">
    <span class="session-user">{{ top_user.username }}</span>
    {% if top_settings_href %}
    <a href="{{ top_settings_href }}">Settings</a>
    {% endif %}
    <form method="post" action="/logout" class="inline-form">
      <a href="#" class="linkish" data-submit-form="1">Logout</a>
    </form>
  </div>
</div>
<nav class="main-menu">
  <a data-main="problems" class="{{ 'active' if top_active_main == 'problems' else '' }}" href="/problems">Problems</a>
  <a data-main="contests" class="{{ 'active' if top_active_main == 'contests' else '' }}" href="/contests">Contests</a>
</nav>
