<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block root_title %}{{ ui_browser_title }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v=20260808-67" />
</head>
<body class="root-layout">
  {% set flash_presenter = 'topbar' %}
  <header class="topbar">
    {% set top_user = user %}
    {% set top_settings_href = '/settings' %}
    {% set top_active_main = active_main %}
    {% include "_topbar_common.html" %}
  </header>

  <div class="page-grid single-column">
    <main class="content-shell">
      <div class="container">{% block content %}{% endblock %}</div>
    </main>
  </div>
  {% include "_page_profile.html" %}
  <script src="/static/ui.js?v=20260808-37" defer></script>
</body>
</html>
