<script type="application/json" id="run-timing-data" data-model-url="{{ static_asset_url('js/run_timing_model.js') }}">{{ timing_preview | tojson }}</script>
{% set timing_controls %}
<select id="run-timing-metric" aria-label="Timing metric">
  <option value="cpu">CPU time</option>
  <option value="wall">Wall time</option>
</select>
{% endset %}
{% call ui_popup('run-timing-popup', 'Timing statistics', dialog_class='run-timing-dialog', header_controls=timing_controls) %}
<div class="run-timing-chart">
  <div class="run-timing-head"><span>Solution</span><div class="run-timing-axis"></div><span>Result</span></div>
  <div class="run-timing-rows"></div>
  <div class="run-timing-drag">
    <div class="run-timing-track"></div>
    <div class="run-timing-guide" role="slider" tabindex="0" aria-label="Preview time limit" aria-valuemin="500">
      <span class="run-timing-handle"></span>
    </div>
  </div>
  <div class="run-timing-foot">
    <span class="run-timing-picked muted" aria-live="polite"></span>
    <nav class="run-timing-pages" aria-label="Timing programs" hidden>
      <button type="button" class="linkish" data-page-step="-1" aria-label="Previous programs">Previous</button>
      <span class="run-timing-page-label muted"></span>
      <button type="button" class="linkish" data-page-step="1" aria-label="Next programs">Next</button>
    </nav>
  </div>
</div>
{% endcall %}
