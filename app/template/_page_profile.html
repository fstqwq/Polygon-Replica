<footer class="page-profile" role="contentinfo" aria-label="page profile">
  <div class="page-profile-inner">
    <div class="page-profile-row page-profile-row-primary">
      <strong class="page-profile-title">Profile</strong>
      <span>Backend render: <strong id="profile-backend-render" data-backend-render-ms="{{ backend_render_ms if backend_render_ms is not none else '' }}">{% if backend_render_ms is not none %}{{ backend_render_ms }} ms{% else %}n/a{% endif %}</strong></span>
      <span>Estimated network overhead: <strong id="profile-network-estimate">n/a</strong></span>
    </div>
    <div class="page-profile-row page-profile-row-tertiary">
      <span>Judgehost: <strong id="profile-judgehost-health-summary" class="page-profile-detail{% if runtime_judgehost_health_danger == '1' %} danger{% endif %}" title="{{ runtime_judgehost_health_summary }}">{{ runtime_judgehost_health_summary }}</strong></span>
    </div>
  </div>
</footer>
