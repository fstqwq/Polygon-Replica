{% extends "base.html" %}
{% block content %}
<h1 class="page-title">View Standard Checker</h1>
<p><strong>Checker:</strong> <code>{{ checker_name }}</code></p>
<p class="muted">Source: upstream <code>third_party/upstream/testlib/checkers/</code>, {{ checker_lines }} lines.</p>
<p><a href="/problems/{{ ctx.problem.slug }}/checker">Back to Checker</a></p>

<form class="form-row" method="post" action="/problems/{{ ctx.problem.slug }}/checker/set-standard">
  <input type="hidden" name="checker_name" value="{{ checker_name }}" />
  <button class="btn" type="submit">Use This Standard Checker</button>
</form>

<pre class="line-context">{{ checker_source }}</pre>
{% endblock %}
