{% extends "base.html" %}
{% block page_styles %}<link rel="stylesheet" href="/static/css/25_code_editor.css?v=20260809-01" />{% endblock %}
{% block page_scripts %}<script src="/static/editor_init.js?v=20260807-03" defer></script>{% endblock %}
{% block content %}
<h1 class="page-title"><code>{{ checker_name }}</code></h1>
<textarea
  class="checker-standard-source-viewer"
  data-code-editor="1"
  data-code-path="{{ checker_name }}"
  data-code-height="620"
  aria-label="{{ checker_name }} source"
  readonly
  spellcheck="false"
>{{ checker_source }}</textarea>
{% endblock %}
