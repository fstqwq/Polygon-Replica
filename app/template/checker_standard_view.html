{% extends "base.html" %}
{% block page_styles %}<link rel="stylesheet" href="{{ static_asset_url('css/25_code_editor.css') }}" />{% endblock %}
{% block page_scripts %}{% include "_editor_assets.html" %}{% endblock %}
{% block content %}
<h1 class="page-title"><code>{{ checker_name }}</code></h1>
<textarea
  class="checker-standard-source-viewer"
  data-code-editor="1"
  data-code-path="{{ checker_name }}"
  data-code-height="620"
  aria-label="{{ checker_name }} source"
  readonly
  spellcheck="false"
>{{ checker_source }}</textarea>
{% endblock %}
