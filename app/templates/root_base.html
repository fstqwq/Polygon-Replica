<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Polygon-Replica</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    {% set top_user = user %}
    {% set top_settings_href = ('/problems/' ~ default_problem ~ '/' ~ user.username ~ '/settings') if default_problem else '' %}
    {% set top_active_main = active_main %}
    {% include "_topbar_common.html" %}
  </header>

  <div class="page-grid single-column">
    <main class="content-shell">
      <div class="container">{% block content %}{% endblock %}</div>
    </main>
  </div>
  {% include "_page_profile.html" %}
  <script src="/static/ui.js" defer></script>
</body>
</html>
