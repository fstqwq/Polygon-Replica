{% extends "base.html" %}
{% block content %}
<h1>Git</h1>
<p>{{ message }}</p>
<form method="post" action="/problems/{{ ctx.problem.slug }}/{{ ctx.user.username }}/git/commit">
  <input name="message" placeholder="Commit message" />
  <button type="submit">Commit</button>
</form>
<form method="post" action="/problems/{{ ctx.problem.slug }}/{{ ctx.user.username }}/git/push"><button type="submit">Push</button></form>
<form method="post" action="/problems/{{ ctx.problem.slug }}/{{ ctx.user.username }}/git/pull"><button type="submit">Pull</button></form>
<form method="post" action="/problems/{{ ctx.problem.slug }}/{{ ctx.user.username }}/git/switch">
  <input name="branch" placeholder="branch" />
  <label>Create <input type="checkbox" name="create" value="1" /></label>
  <button type="submit">Switch</button>
</form>
<form method="post" action="/problems/{{ ctx.problem.slug }}/{{ ctx.user.username }}/git/merge">
  <input name="source_branch" placeholder="source branch" />
  <button type="submit">Merge into main</button>
</form>
<h2>Status</h2>
<pre>{{ status.status }}</pre>
<h2>Diff</h2>
<pre>{{ status.diff }}</pre>
{% endblock %}
