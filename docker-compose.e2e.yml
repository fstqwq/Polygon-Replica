services:
  tex-smoke:
    image: ${POLYGON_REPLICA_E2E_IMAGE:?set by tests/scripts/docker-e2e.sh}
    entrypoint: ["python3", "/opt/e2e/tex_smoke.py"]
    restart: "no"
    network_mode: none
    volumes:
      - ./tests/docker_e2e:/opt/e2e:ro
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined

  bootstrap:
    image: ${POLYGON_REPLICA_E2E_IMAGE:?set by tests/scripts/docker-e2e.sh}
    entrypoint: ["python3", "/opt/e2e/bootstrap.py"]
    restart: "no"
    network_mode: none
    environment: &runtime-environment
      POLYGON_REPLICA_DB: /var/lib/polygon-replica/metadata.db
      POLYGON_REPLICA_BARE_ROOT: /srv/polygon-replica/git
      POLYGON_REPLICA_WORKSPACE_ROOT: /srv/polygon-replica/workspaces
      POLYGON_REPLICA_ARTIFACTS_ROOT: /srv/polygon-replica/export
      POLYGON_REPLICA_CACHE_ROOT: /tmp/polygon-replica
      POLYGON_REPLICA_CONTEST_SOURCE_ROOT: /var/lib/polygon-replica/contest-sources
      POLYGON_REPLICA_BACKUP_ROOT: /var/backups/polygon-replica
      POLYGON_REPLICA_E2E_STATE_DIR: /var/backups/polygon-replica/e2e-state
      POLYGON_REPLICA_E2E_JUDGEHOST_TOKEN: ${POLYGON_REPLICA_E2E_JUDGEHOST_TOKEN:?set by tests/scripts/docker-e2e.sh}
    volumes:
      - ./tests/docker_e2e:/opt/e2e:ro
      - srv:/srv/polygon-replica
      - var:/var/lib/polygon-replica
      - cache:/tmp/polygon-replica
      - state:/var/backups/polygon-replica
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${POLYGON_REPLICA_E2E_IMAGE:?set by tests/scripts/docker-e2e.sh}
    restart: unless-stopped
    environment: *runtime-environment
    volumes:
      - srv:/srv/polygon-replica
      - var:/var/lib/polygon-replica
      - cache:/tmp/polygon-replica
      - state:/var/backups/polygon-replica
    networks:
      - e2e
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/login', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 45
      start_period: 10s
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined

  mock-judgehost:
    image: ${POLYGON_REPLICA_E2E_IMAGE:?set by tests/scripts/docker-e2e.sh}
    entrypoint: ["python3", "/opt/e2e/mock_judgehost.py"]
    restart: "no"
    environment:
      POLYGON_REPLICA_E2E_APP_URL: http://app:8001/api/v4
      POLYGON_REPLICA_E2E_STATE_DIR: /var/backups/polygon-replica/e2e-state
      POLYGON_REPLICA_E2E_JUDGEHOST_TOKEN: ${POLYGON_REPLICA_E2E_JUDGEHOST_TOKEN:?set by tests/scripts/docker-e2e.sh}
    volumes:
      - ./tests/docker_e2e:/opt/e2e:ro
      - state:/var/backups/polygon-replica
    networks:
      - e2e
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/backups/polygon-replica/e2e-state/mock-ready"]
      interval: 1s
      timeout: 1s
      retries: 45
      start_period: 2s

  runner:
    image: ${POLYGON_REPLICA_E2E_IMAGE:?set by tests/scripts/docker-e2e.sh}
    entrypoint: ["python3", "/opt/e2e/runner.py"]
    restart: "no"
    environment:
      POLYGON_REPLICA_E2E_APP_ORIGIN: http://app:8001
      POLYGON_REPLICA_E2E_DB: /var/lib/polygon-replica/metadata.db
      POLYGON_REPLICA_E2E_CACHE_ROOT: /tmp/polygon-replica
      POLYGON_REPLICA_E2E_STATE_DIR: /var/backups/polygon-replica/e2e-state
    volumes:
      - ./tests/docker_e2e:/opt/e2e:ro
      # SQLite WAL readers need directory access for the shared-memory file.
      # runner.py still opens the database with URI mode=ro.
      - var:/var/lib/polygon-replica
      - cache:/tmp/polygon-replica:ro
      - state:/var/backups/polygon-replica:ro
    networks:
      - e2e

networks:
  e2e:
    internal: true

volumes:
  srv:
  var:
  cache:
  state:
