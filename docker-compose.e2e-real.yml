services:
  judgehost:
    image: ${POLYGON_REPLICA_E2E_JUDGEHOST_IMAGE:?set by tests/scripts/e2e-real.sh}
    privileged: true
    cgroup: host
    hostname: ${POLYGON_REPLICA_E2E_JUDGEHOST_CONTAINER_HOSTNAME:?set by tests/scripts/e2e-real.sh}
    restart: "no"
    environment:
      CONTAINER_TIMEZONE: UTC
      DAEMON_ID: ${POLYGON_REPLICA_E2E_JUDGEHOST_DAEMON_ID:?set by tests/scripts/e2e-real.sh}
      DOMSERVER_BASEURL: http://app:8001/
      JUDGEDAEMON_USERNAME: judgehost
      JUDGEDAEMON_PASSWORD: ${POLYGON_REPLICA_E2E_JUDGEHOST_TOKEN:?set by tests/scripts/e2e-real.sh}
      RUN_USER_UID_GID: ${POLYGON_REPLICA_E2E_JUDGEHOST_RUN_UID:?set by tests/scripts/e2e-real.sh}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    networks:
      - e2e
    depends_on:
      app:
        condition: service_healthy

  e2e-real:
    image: ${POLYGON_REPLICA_E2E_IMAGE:?set by tests/scripts/e2e-real.sh}
    entrypoint: ["python3", "/opt/e2e/e2e_real.py"]
    restart: "no"
    environment:
      GIT_OPTIONAL_LOCKS: "0"
      POLYGON_REPLICA_E2E_APP_ORIGIN: http://app:8001
      POLYGON_REPLICA_E2E_DB: /var/lib/polygon-replica/metadata.db
      POLYGON_REPLICA_E2E_CACHE_ROOT: /tmp/polygon-replica
      POLYGON_REPLICA_E2E_ARTIFACTS_ROOT: /srv/polygon-replica/export
      POLYGON_REPLICA_E2E_STATE_DIR: /var/backups/polygon-replica/e2e-state
      POLYGON_REPLICA_E2E_BARE_ROOT: /srv/polygon-replica/git
      POLYGON_REPLICA_E2E_WORKSPACE_ROOT: /srv/polygon-replica/workspaces
      POLYGON_REPLICA_E2E_JUDGEHOST_TOKEN: ${POLYGON_REPLICA_E2E_JUDGEHOST_TOKEN:?set by tests/scripts/e2e-real.sh}
      POLYGON_REPLICA_E2E_JUDGEHOST_HOSTNAME: ${POLYGON_REPLICA_E2E_JUDGEHOST_HOSTNAME:?set by tests/scripts/e2e-real.sh}
      POLYGON_REPLICA_E2E_VARIANT: ${POLYGON_REPLICA_E2E_VARIANT:?set by tests/scripts/e2e-real.sh}
      POLYGON_REPLICA_E2E_PRODUCT_TAIL: ${POLYGON_REPLICA_E2E_PRODUCT_TAIL:?set by tests/scripts/e2e-real.sh}
      POLYGON_REPLICA_E2E_ADMIN_PASSWORD: ${POLYGON_REPLICA_E2E_ADMIN_PASSWORD:?set by tests/scripts/e2e-real.sh}
      POLYGON_REPLICA_E2E_SKILLS_ROOT: /opt/polygon-skills
      POLYGON_REPLICA_E2E_SKILLS_COMMIT: ${POLYGON_REPLICA_E2E_SKILLS_COMMIT:?set by tests/scripts/e2e-real.sh}
    volumes:
      - ./tests/docker_e2e:/opt/e2e:ro
      - ${POLYGON_REPLICA_E2E_SKILLS_HOST_ROOT:?set by tests/scripts/e2e-real.sh}:/opt/polygon-skills:ro
      - srv:/srv/polygon-replica:ro
      # SQLite WAL readers need directory access for the shared-memory file.
      # e2e_real.py still opens metadata.db with URI mode=ro.
      - var:/var/lib/polygon-replica
      - cache:/tmp/polygon-replica:ro
      - state:/var/backups/polygon-replica
    networks:
      - e2e
