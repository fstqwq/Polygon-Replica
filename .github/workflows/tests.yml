name: Tests

on:
  push:
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/*.md"

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        group: [unit, service, executor, e2e]
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
        cache: pip
    - name: Install sandbox and renderer dependencies
      if: matrix.group == 'service' || matrix.group == 'executor' || matrix.group == 'e2e'
      run: |
        sudo apt-get update
        packages=(bubblewrap p7zip-full)
        if [ "${{ matrix.group }}" = "e2e" ]; then
          packages+=(pandoc poppler-utils librsvg2-bin)
        fi
        sudo apt-get install -y "${packages[@]}"
        sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
        if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
        bwrap --die-with-parent --new-session --ro-bind / / --chdir / -- /bin/sh -lc true
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Configure git identity for tests
      run: |
        git config --global user.name "Polygon Replica CI"
        git config --global user.email "ci@polygon-replica.local"
    - name: Run ${{ matrix.group }} tests
      env:
        POLYGON_REPLICA_TEST_GROUPS: ${{ matrix.group }}
      run: PYTHONPATH="$GITHUB_WORKSPACE" bash tests/scripts/test.sh
    - name: Upload timing summary
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: test-timings-${{ matrix.group }}
        path: .test-results/${{ matrix.group }}.json
        if-no-files-found: warn
