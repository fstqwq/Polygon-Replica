name: CI

on: [push]

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pylint
    - name: Run static checks
      run: PYTHONPATH="$GITHUB_WORKSPACE" bash tests/scripts/check.sh

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [unit, service, executor, e2e]
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
    - name: Install sandbox dependency
      if: matrix.group == 'service' || matrix.group == 'executor' || matrix.group == 'e2e'
      run: |
        sudo apt-get update
        sudo apt-get install -y bubblewrap
        sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
        if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
        bwrap --die-with-parent --new-session --ro-bind / / --chdir / -- /bin/sh -lc true
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Configure git identity for tests
      run: |
        git config --global user.name "Polygon Replica CI"
        git config --global user.email "ci@polygon-replica.local"
    - name: Run ${{ matrix.group }} tests
      env:
        POLYGON_REPLICA_TEST_GROUPS: ${{ matrix.group }}
      run: PYTHONPATH="$GITHUB_WORKSPACE" bash tests/scripts/test.sh
    - name: Upload timing summary
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: test-timings-${{ matrix.group }}
        path: .test-results/${{ matrix.group }}.json
        if-no-files-found: warn

  e2e-mock:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Configure sandbox namespaces
      run: |
        sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
        sudo sysctl -w user.max_user_namespaces=1048576
        if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
    - name: Run deployed mock-Judgehost E2E
      run: bash tests/scripts/e2e-mock.sh
