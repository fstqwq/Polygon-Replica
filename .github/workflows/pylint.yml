name: CI

on: [push]

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-static.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-static.txt
    - name: Run static checks
      run: PYTHONPATH="$GITHUB_WORKSPACE" bash tests/scripts/check.sh

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [unit, service, executor, e2e]
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
        cache: pip
    - name: Install sandbox dependency
      if: matrix.group == 'service' || matrix.group == 'executor' || matrix.group == 'e2e'
      run: |
        sudo apt-get update
        sudo apt-get install -y bubblewrap
        sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
        if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
        bwrap --die-with-parent --new-session --ro-bind / / --chdir / -- /bin/sh -lc true
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Configure git identity for tests
      run: |
        git config --global user.name "Polygon Replica CI"
        git config --global user.email "ci@polygon-replica.local"
    - name: Run ${{ matrix.group }} tests
      env:
        POLYGON_REPLICA_TEST_GROUPS: ${{ matrix.group }}
      run: PYTHONPATH="$GITHUB_WORKSPACE" bash tests/scripts/test.sh
    - name: Upload timing summary
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: test-timings-${{ matrix.group }}
        path: .test-results/${{ matrix.group }}.json
        if-no-files-found: warn

  e2e-mock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      POLYGON_REPLICA_E2E_IMAGE: polygon-replica-e2e-mock:${{ github.sha }}
      POLYGON_REPLICA_E2E_IMAGE_PREBUILT: "1"
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build E2E image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        load: true
        tags: ${{ env.POLYGON_REPLICA_E2E_IMAGE }}
        cache-from: type=gha,scope=e2e-mock
        cache-to: type=gha,mode=max,scope=e2e-mock
    - name: Configure sandbox namespaces
      run: |
        sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
        sudo sysctl -w user.max_user_namespaces=1048576
        if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
    - name: Run Judgehost protocol E2E
      run: bash tests/scripts/docker-e2e.sh

  e2e-real-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      POLYGON_REPLICA_E2E_IMAGE: polygon-replica-e2e-real:${{ github.sha }}
      POLYGON_REPLICA_E2E_IMAGE_PREBUILT: "1"
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Check out latest Polygon Skills
      uses: actions/checkout@v6
      with:
        repository: fstqwq/Polygon-Skills
        path: .e2e/polygon-skills
        fetch-depth: 1
        persist-credentials: false
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build E2E image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        load: true
        tags: ${{ env.POLYGON_REPLICA_E2E_IMAGE }}
        cache-from: type=gha,scope=e2e-real-product
        cache-to: type=gha,mode=max,scope=e2e-real-product
    - name: Configure sandbox namespaces
      run: |
        sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
        sudo sysctl -w user.max_user_namespaces=1048576
        if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
    - name: Run deployed product journey on official Judgehost 9.0.0
      run: bash tests/scripts/e2e-real.sh
    - name: Upload failure logs
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: e2e-real-product-logs
        path: .e2e/e2e-real
        if-no-files-found: warn

  e2e-real-domserver-900:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      POLYGON_REPLICA_E2E_IMAGE: polygon-replica-e2e-domserver:${{ github.sha }}
      POLYGON_REPLICA_E2E_IMAGE_PREBUILT: "1"
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Check out latest Polygon Skills
      uses: actions/checkout@v6
      with:
        repository: fstqwq/Polygon-Skills
        path: .e2e/polygon-skills
        fetch-depth: 1
        persist-credentials: false
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build E2E image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        load: true
        tags: ${{ env.POLYGON_REPLICA_E2E_IMAGE }}
        cache-from: type=gha,scope=e2e-real-domserver-900
        cache-to: type=gha,mode=max,scope=e2e-real-domserver-900
    - name: Configure Judgehost host requirements
      run: |
        sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
        sudo sysctl -w user.max_user_namespaces=1048576
        if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
    - name: Import and execute three DOMjudge 9.0.0 package modes
      run: bash tests/scripts/e2e-domserver-900.sh
    - name: Upload failure diagnostics
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: e2e-real-domserver-900-logs
        path: .e2e/e2e-domserver-900
        if-no-files-found: warn
