name: CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bubblewrap
        sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
        if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
        bwrap --die-with-parent --new-session --ro-bind / / --chdir / -- /bin/sh -lc true
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pylint
    - name: Configure git identity for tests
      run: |
        git config --global user.name "Polygon Replica CI"
        git config --global user.email "ci@polygon-replica.local"
    - name: Analysing the code with pylint
      run: |
        PYTHONPATH="$GITHUB_WORKSPACE" python -m pylint app
    - name: Run project tests
      run: |
        PYTHONPATH="$GITHUB_WORKSPACE" bash tests/scripts/test.sh
