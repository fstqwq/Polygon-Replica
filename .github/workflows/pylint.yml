name: Fast CI

on:
  push:

concurrency:
  group: fast-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-static.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-static.txt
    - name: Run pre-push checks
      run: bash .githooks/pre-push
    - name: Upload timing summary
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: test-timings-prepush
        path: .test-results/prepush.json
        if-no-files-found: warn
